name: Build, test & release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-14
            label: macOS-AppleSilicon
          - os: macos-15-intel
            label: macOS-Intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Build app
        run: |
          python packaging/make_icons.py
          pyinstaller --noconfirm packaging/kataware.spec

      - name: Self-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KATAWARE_HOME = "$PWD\selftest-home"
          $p = Start-Process -FilePath "dist\Kataware.exe" -ArgumentList "--self-test","$PWD\selftest-report.json" -Wait -PassThru
          Get-Content selftest-report.json
          if ($p.ExitCode -ne 0) { Get-Content "$env:KATAWARE_HOME\kataware.log"; exit 1 }

      - name: Self-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          export KATAWARE_HOME="$PWD/selftest-home"
          set +e
          dist/Kataware.app/Contents/MacOS/Kataware --self-test "$PWD/selftest-report.json"
          code=$?
          set -e
          cat selftest-report.json || true
          if [ $code -ne 0 ]; then cat "$KATAWARE_HOME/kataware.log" || true; exit 1; fi
          plutil -p dist/Kataware.app/Contents/Info.plist | grep -E "NSBluetoothAlwaysUsageDescription|LSUIElement"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\Kataware.exe "out\Kataware-${{ matrix.label }}.exe"

      - name: Microsoft Store package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Set these repository variables to the values Partner Center shows
          # (Product identity) once the app name is reserved.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'kyonccc.Kataware' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Kataware' }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'kyonccc' }}
        run: |
          $env:KATAWARE_ONEDIR = "1"
          pyinstaller --noconfirm --distpath dist-onedir --workpath build-onedir packaging/kataware.spec
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item Env:KATAWARE_ONEDIR

          # 1) Unsigned package for Partner Center (the Store signs it)
          ./packaging/build_msix.ps1 -AppDir dist-onedir/Kataware -OutFile msix/Kataware-Store.msix `
            -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME

          # 2) Self-signed package to try the Store build on a PC before submitting
          $pass = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Kataware Test" -KeyUsage DigitalSignature `
            -FriendlyName "Kataware Test" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath msix/Kataware-Test.cer | Out-Null
          ./packaging/build_msix.ps1 -AppDir dist-onedir/Kataware -OutFile msix/Kataware-Test.msix `
            -IdentityName "kyonccc.KatawareTest" -Publisher "CN=Kataware Test" -PublisherDisplayName "kyonccc (test)" `
            -PfxFile test.pfx -PfxPassword $pass
          Remove-Item test.pfx

      - name: Self-test installed Store package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Certificate -FilePath msix/Kataware-Test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path msix/Kataware-Test.msix
          Get-AppxPackage kyonccc.KatawareTest | Format-List Name, PackageFamilyName, Version, InstallLocation
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\kataware.exe"
          $p = Start-Process -FilePath $alias -ArgumentList "--self-test", "$PWD\msix-selftest-report.json" -Wait -PassThru
          Get-Content msix-selftest-report.json
          $log = Get-ChildItem "$env:LOCALAPPDATA\Packages\kyonccc.KatawareTest_*\LocalState\kataware.log" -ErrorAction SilentlyContinue
          if ($log) { Copy-Item $log.FullName msix-kataware.log }
          Get-AppxPackage kyonccc.KatawareTest | Remove-AppxPackage
          if ($p.ExitCode -ne 0) { if ($log) { Get-Content $log.FullName }; exit 1 }
          $r = Get-Content msix-selftest-report.json -Raw | ConvertFrom-Json
          if (-not $r.steps.package.detail.packaged) { Write-Error "app did not run as a package"; exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: Kataware-MicrosoftStore
          path: msix/*

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/Kataware.app "out/Kataware-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kataware-${{ matrix.label }}
          path: out/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: selftest-${{ matrix.label }}
          path: |
            selftest-report.json
            selftest-home/kataware.log
            msix-selftest-report.json
            msix-kataware.log
          if-no-files-found: ignore

  release:
    needs: build
    # Release on a v* tag, or on a push whose commit message contains [release]
    # (the tag is then created from the version in src/kataware/__init__.py).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Determine tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/kataware/__init__.py').read()).group(1))")
            echo "name=v$v" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Kataware-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          # Store packages are submitted through Partner Center, not released here
          rm -f release/*.msix release/*.cer
          cd release
          sha256sum Kataware-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/Kataware-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Kataware ${{ steps.tag.outputs.name }}
          make_latest: true
          files: release/*
          generate_release_notes: true
          body: |
            ## ダウンロード / Download
            | OS | ファイル / File |
            | --- | --- |
            | Windows 10 / 11 (64bit) | `Kataware-Windows-x64.exe` |
            | Mac (Apple シリコン / Apple silicon) | `Kataware-macOS-AppleSilicon.zip` |
            | Mac (Intel) | `Kataware-macOS-Intel.zip` |

            ### ファイルの確認 / Verify the download
            `SHA256SUMS.txt` のハッシュ値と一致するか、または GitHub CLI で GitHub Actions がビルドしたものか確認できます。
            ```
            gh attestation verify Kataware-Windows-x64.exe --repo kyonccc/Kataware
            ```

            使い方・初回起動時の注意は [README](https://github.com/kyonccc/Kataware#readme) を参照してください。
            See the [README](https://github.com/kyonccc/Kataware#readme) for usage and first-launch notes.

            Claude Code で作成 / Built with [Claude Code](https://claude.com/claude-code)
